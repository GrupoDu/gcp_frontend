services:
  web:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3001
    env_file:
      - .env
    ports:
      - "${DEV_PORT}:3001"
    expose:
      - "3001"
    networks:
      - front-network

networks:
  front-network:
    name: erp-network
    external: true
